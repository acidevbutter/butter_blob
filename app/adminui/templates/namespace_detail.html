{% extends "base.html" %}{% block content %}<p><a href="/admin">← namespaces</a> · <a href="/admin/namespaces/{{ namespace.slug }}/blobs">Browse blobs</a></p><h1>{{ namespace.slug }}</h1><form class="card" method="post"><label>Storage quota bytes<input name="max_storage_bytes" value="{{ namespace.max_storage_bytes or '' }}"></label><label>Max file bytes<input name="max_file_bytes" value="{{ namespace.max_file_bytes or '' }}"></label><label>Allowed content types (comma-separated)<input name="allowed_content_types" value="{{ (namespace.allowed_content_types or [])|join(', ') }}"></label><label>Allowed extensions (comma-separated)<input name="allowed_extensions" value="{{ (namespace.allowed_extensions or [])|join(', ') }}"></label><label>Image quality 1–100<input name="image_compression_quality" value="{{ namespace.image_compression_quality or '' }}"></label><label>Image max dimension<input name="image_max_dimension" value="{{ namespace.image_max_dimension or '' }}"></label><button>Save limits</button></form>{% endblock %}
