{% extends "base.html" %}{% block content %}<p><a href="/admin/namespaces/{{ namespace }}">← {{ namespace }}</a></p><h1>Blobs</h1><form method="get"><select name="visibility"><option value="">Any visibility</option>{% for value in ['public','private'] %}<option value="{{ value }}" {% if visibility and visibility.value == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select><select name="status"><option value="">Any status</option>{% for value in ['pending','stored','deleted'] %}<option value="{{ value }}" {% if status and status.value == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select><button>Filter</button></form><table><thead><tr><th>Filename</th><th>Status</th><th>Size</th><th>Created</th></tr></thead><tbody>{% for blob in blobs %}<tr><td><a href="/admin/blobs/{{ blob.id }}">{{ blob.filename }}</a></td><td>{{ blob.status.value }}</td><td>{{ blob.byte_size }}</td><td>{{ blob.created_at }}</td></tr>{% else %}<tr><td colspan="4">No blobs found.</td></tr>{% endfor %}</tbody></table>{% endblock %}
