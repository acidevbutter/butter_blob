{% extends "base.html" %}{% block content %}<h1>Namespaces</h1><table><thead><tr><th>Namespace</th><th>Usage</th><th>Blobs</th></tr></thead><tbody>{% for ns in namespaces %}<tr><td><a href="/admin/namespaces/{{ ns.slug }}">{{ ns.slug }}</a></td><td>{{ ns.total_bytes }} / {{ ns.max_storage_bytes or '∞' }} bytes<div class="bar"><i style="width:{% if ns.max_storage_bytes %}{{ [100, ns.total_bytes * 100 / ns.max_storage_bytes]|min }}{% else %}0{% endif %}%"></i></div></td><td><a href="/admin/namespaces/{{ ns.slug }}/blobs">{{ ns.blob_count }}</a></td></tr>{% else %}<tr><td colspan="3">No namespaces yet.</td></tr>{% endfor %}</tbody></table>{% endblock %}
