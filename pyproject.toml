[tool.poetry]
name = "butter-blob"
version = "0.1.0"
description = "DevButter company-wide blob store: S3-backed file storage and serving for every DevButter app and API, with per-namespace quotas, image compression, temporary files and an audit trail."
authors = ["DevButter <hello@devbutter.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = { extras = ["email"], version = "^2.9.0" }
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
greenlet = "^3.1.0"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
boto3 = "^1.35.0"
celery = "^5.4.0"
redis = "^5.0.8"
httpx = "^0.27.0"
python-multipart = "^0.0.12"
python-slugify = "^8.0.4"
pillow = "^10.4.0"
jinja2 = "^3.1.6"
bcrypt = "^5.0.0"
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
aiosqlite = "^0.20.0"
moto = { extras = ["s3"], version = "^5.0.0" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The project has a top-level `alembic/` dir, which makes isort mistake the
# installed `alembic` package for first-party code.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
# boto3/botocore/moto/celery ship no type information.
module = ["boto3.*", "botocore.*", "moto.*", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test functions take pytest fixtures as untyped parameters by design.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
