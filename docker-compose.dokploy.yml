# Dokploy "Compose" service -- Compose Path: ./docker-compose.dokploy.yml.
#
#   Environment: Dokploy "Environment" tab. Dokploy writes it to .env next to
#                this file; every service loads it via env_file and compose
#                interpolates ${VAR} from it. Nothing secret lives in git.
#                S3_ENDPOINT_URL=http://minio:9000 (infra/dokploy deps stack);
#                S3_PUBLIC_ENDPOINT_URL must be the browser-reachable MinIO URL.
#   Domains:     Dokploy "Domains" tab -> pick the service + container port;
#                Dokploy injects the Traefik labels (HTTPS via Let's Encrypt).
#                No `ports:` here on purpose: Traefik is the only way in.
#   Network:     dokploy-network (external, created by Dokploy) is shared with
#                Traefik and the Dokploy-managed Postgres/Redis. The aliases are
#                the stable inter-service DNS names the other services use in
#                their *_BASE_URL vars -- one Dokploy server = one environment,
#                or these aliases collide across staging/production.
#   Health:      each image ships its own HEALTHCHECK (api: GET /health,
#                worker: celery inspect ping).
#   Worker:      same Dockerfile, build target `worker` (Celery). The api runs
#                the migrations; the worker starts once the api is healthy and
#                gets 60s to finish in-flight tasks on redeploy. REDIS_URL
#                points at the Dokploy-managed Redis.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  blob-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dokploy
      target: api
    env_file:
      - path: .env
        required: false
    expose:
      - "8000"
    networks:
      dokploy-network:
        aliases:
          - blob-api
    restart: unless-stopped
    logging: *default-logging

  blob-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dokploy
      target: worker
    env_file:
      - path: .env
        required: false
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      blob-api:
        condition: service_healthy
    stop_grace_period: 60s
    networks:
      - dokploy-network
    restart: unless-stopped
    logging: *default-logging

networks:
  dokploy-network:
    external: true
