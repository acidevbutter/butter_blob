services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      # Docker DNS + boto3. DATABASE_* come from env_file.
      S3_ENDPOINT_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      # MinIO doesn't verify these against IAM, but boto3 refuses to sign a
      # request with no credentials at all. On real AWS the ECS task role
      # supplies credentials automatically and these are never set.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
    networks:
      default:
      devbutter_shared:
        aliases:
          - blob-api
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /srv/app
        - path: ./alembic
          action: sync+restart
          target: /srv/alembic

  worker:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      REDIS_URL: redis://redis:6379/0
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic
    networks:
      default:
      devbutter_shared:

  # Local Redis, standing in for the same Redis instance that fronts prod/
  # staging on Coolify -- the worker's Celery client code is identical
  # either way, only REDIS_URL differs.
  redis:
    image: redis:7-alpine
    profiles: ["dev"]
    ports:
      - "6379:6379"

networks:
  default:
  # shared-postgres and minio live in the infra/ compose stack -- bring that up
  # first: `docker network create devbutter_shared` then
  # `docker compose -f infra/docker-compose.yml up -d shared-postgres minio createbuckets`.
  devbutter_shared:
    external: true
